
name: tf-risk CI

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test, Build and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with coverage
        run: go test -cover ./...

      - name: Build tf-risk
        run: go build -o tf-risk .

      - name: Verify safe plan
        run: |
          ./tf-risk \
            --plan examples/basic/plan.json \
            --fail-on high

      - name: Verify unsafe plan is blocked
        shell: bash
        run: |
          set +e
          ./tf-risk \
            --plan examples/basic/unsafe-plan.json \
            --fail-on high
          status=$?
          set -e

          if [ "$status" -ne 1 ]; then
            echo "ERROR: Expected exit code 1, got $status."
            exit 1
          fi

          echo "PASS: Unsafe plan was blocked."

      - name: Generate JSON report
        run: |
          ./tf-risk \
            --plan examples/basic/unsafe-plan.json \
            --format json > tf-risk.json

      - name: Generate SARIF report
        run: |
          ./tf-risk \
            --plan examples/basic/unsafe-plan.json \
            --format sarif > tf-risk.sarif

      - name: Validate SARIF contains expected finding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("tf-risk.sarif")
          content = path.read_bytes().removeprefix(b"\xef\xbb\xbf")
          report = json.loads(content.decode("utf-8"))

          if report.get("version") != "2.1.0":
              raise SystemExit("ERROR: Unexpected SARIF version.")

          results = [
              result
              for run in report.get("runs", [])
              for result in run.get("results", [])
          ]

          rule_ids = {result.get("ruleId") for result in results}

          if "TF003" not in rule_ids:
              raise SystemExit("ERROR: TF003 is missing from SARIF.")

          print(f"PASS: SARIF contains {len(results)} finding(s).")
          print(f"Detected rules: {', '.join(sorted(rule_ids))}")

          path.write_text(
              json.dumps(report, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Upload SARIF to GitHub Code Scanning
        if: success() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tf-risk.sarif
