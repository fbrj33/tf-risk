name: tf-risk CI

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test, Build and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run tests with coverage
        run: go test -cover ./...

      - name: Build tf-risk
        run: go build -o tf-risk .

      - name: Verify safe plan
        run: |
          ./tf-risk \
            --plan examples/basic/plan.json \
            --fail-on high

      - name: Verify unsafe plan is blocked
        shell: bash
        run: |
          set +e

          ./tf-risk \
            --plan examples/basic/unsafe-plan.json \
            --fail-on high

          status=$?

          set -e

          if [ "$status" -eq 0 ]; then
            echo "ERROR: Unsafe plan was not blocked."
            exit 1
          fi

          if [ "$status" -ne 1 ]; then
            echo "ERROR: Unexpected exit code: $status"
            exit 1
          fi

          echo "PASS: Unsafe plan was blocked."

      - name: Generate JSON report
        run: |
          ./tf-risk \
            --plan examples/basic/unsafe-plan.json \
            --format json > tf-risk.json

      - name: Generate SARIF report
        run: |
          ./tf-risk \
            --plan examples/basic/unsafe-plan.json \
            --format sarif > tf-risk.sarif

      - name: Validate SARIF JSON
        run: |
          python -m json.tool tf-risk.sarif > /dev/null
          echo "SARIF is valid JSON."

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tf-risk.sarif